# XcodeGen spec for the iOS client. Run `xcodegen generate` from src/ios.
name: CurrencyConverter

options:
  bundleIdPrefix: com.eduardyelenskiy
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Strings live in String Catalogs (resources/*.xcstrings); the compiler extracts
    # them from Text("…"), String(localized:) and LocalizedStringResource.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CurrencyConverter:
    type: application
    platform: iOS
    sources:
      - path: CurrencyConverter
    info:
      # Generated by XcodeGen and merged with the generated Info.plist keys below.
      path: CurrencyConverter/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSAppTransportSecurity:
          # Plain HTTP only to local addresses (our dev server); the app talks to nothing else.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardyelenskiy.currencyconverter
        PRODUCT_NAME: CurrencyConverter
        # Our server. The simulator reaches the Mac's localhost directly; for a phone use
        # the Mac's LAN address. Can be overridden at launch with -APIBaseURL <url>.
        API_BASE_URL: http://127.0.0.1:8080
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Currency
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - CurrencyConverterTests
      gatherCoverageData: true

  CurrencyConverterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Tests live outside the iOS folder, in <repo>/tests/ios.
      - path: ../../tests/ios
        name: CurrencyConverterTests
      # Cross-rate vectors shared with the server tests, copied into the test bundle.
      - path: ../../tests/fixtures
        name: Fixtures
        buildPhase: resources
    dependencies:
      - target: CurrencyConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardyelenskiy.currencyconverter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CurrencyConverter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CurrencyConverter"
        BUNDLE_LOADER: "$(TEST_HOST)"
