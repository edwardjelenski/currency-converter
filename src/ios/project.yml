# XcodeGen spec for the iOS client. Run `xcodegen generate` from src/ios.
name: CurrencyConverter

options:
  bundleIdPrefix: com.eduardyelenskiy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  CurrencyConverter:
    type: application
    platform: iOS
    sources:
      - path: CurrencyConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardyelenskiy.currencyconverter
        PRODUCT_NAME: CurrencyConverter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Currency
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - CurrencyConverterTests
      gatherCoverageData: true

  CurrencyConverterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      # Tests live outside the iOS folder, in <repo>/tests/ios.
      - path: ../../tests/ios
        name: CurrencyConverterTests
    dependencies:
      - target: CurrencyConverter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eduardyelenskiy.currencyconverter.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/CurrencyConverter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/CurrencyConverter"
        BUNDLE_LOADER: "$(TEST_HOST)"
